apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
# 1 control plane + 2 workers
nodes:
- role: control-plane
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 30007
    hostPort: 30007
  - containerPort: 30008
    hostPort: 30008
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
- role: worker
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
- role: worker
  extraMounts:
    - hostPath: /tmp
      containerPath: /data