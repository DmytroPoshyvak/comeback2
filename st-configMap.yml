apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-mysql
  namespace: mysql
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS todoapp_db;
    GRANT ALL PRIVILEGES ON todoapp_db.* TO 'app_user'@'%';
    FLUSH PRIVILEGES;
    USE todoapp_db;
    CREATE TABLE IF NOT EXISTS counter (
        id INT AUTO_INCREMENT PRIMARY KEY,
        value INT
    );